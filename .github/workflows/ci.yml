name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      # The container tests build a real MKV rather than faking ffprobe's
      # output. Without ffmpeg they skip, which would hide real breakage.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --all-extras --dev --python ${{ matrix.python-version }}

      # No API key is set, deliberately. Every test runs against fake
      # providers; anything that reaches the network is a bug.
      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest --cov --cov-report=term-missing

  install:
    name: Install as a tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5

      # Proves the published install instructions actually work.
      - name: uv tool install from checkout
        run: uv tool install .

      - name: Command is on PATH and runs
        run: |
          aisubtranslator --help
          subtl --help
