[project]
name = "aisubtranslator"
version = "0.1.0"
description = "Translate subtitles with an LLM, from a subtitle file or straight out of a video"
readme = "README.md"
authors = [
    { name = "mhensberg2003", email = "info@hensbergstudio.dk" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["subtitles", "translation", "srt", "ass", "llm", "ffmpeg", "openrouter"]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Danish",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pysubs2>=1.8.1",
    "rich>=15.0.0",
    "tomli-w>=1.2.0",
    "typer>=0.27.1",
]

[project.urls]
Homepage = "https://github.com/mhensberg2003/aisubtranslator"
Repository = "https://github.com/mhensberg2003/aisubtranslator"
Issues = "https://github.com/mhensberg2003/aisubtranslator/issues"

[project.scripts]
aisubtranslator = "aisubtranslator.cli:app"
subtl = "aisubtranslator.cli:app"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/aisubtranslator"]
omit = ["*/__init__.py"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
